<script>
/* حماية: لو المشاهد يمنع التخزين المحلي نستخدم ذاكرة مؤقتة */
(function(){
  var ok=true;
  try{ var t='__t__'; window.localStorage.setItem(t,'1'); window.localStorage.removeItem(t); }
  catch(e){ ok=false; }
  if(ok) return;
  var mem={};
  var store={
    getItem:function(k){ return (k in mem)?mem[k]:null; },
    setItem:function(k,v){ mem[k]=String(v); },
    removeItem:function(k){ delete mem[k]; },
    clear:function(){ mem={}; },
    key:function(i){ return Object.keys(mem)[i]||null; }
  };
  try{
    Object.defineProperty(window,'localStorage',{ configurable:true, get:function(){ return store; } });
  }catch(e){
    try{ window.localStorage=store; }catch(e2){}
  }
})();
</script>

// ✅ دالة مساعدة: فلترة المبيعات حسب الفترة الزمنية
function filterByPeriod(sales, period){
 const now = new Date();
 const start = new Date();
 start.setHours(0,0,0,0);
 
 switch(period){
  case 'today':
   return sales.filter(s => isSameDay(new Date(s.date), now));
  case 'week':
   const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate()-7);
   return sales.filter(s => new Date(s.date) >= weekAgo);
  case 'month':
   const monthAgo = new Date(now); monthAgo.setMonth(monthAgo.getMonth()-1);
   return sales.filter(s => new Date(s.date) >= monthAgo);
  case 'halfyear':
   const halfAgo = new Date(now); halfAgo.setMonth(halfAgo.getMonth()-6);
   return sales.filter(s => new Date(s.date) >= halfAgo);
  case 'year':
   const yearAgo = new Date(now); yearAgo.setFullYear(yearAgo.getFullYear()-1);
   return sales.filter(s => new Date(s.date) >= yearAgo);
  default:
   return sales;
 }
}

function calcStats(sales, rets){
 const validSales = sales.filter(s => !s.cancelled);
 const totalSales = validSales.reduce((s,x) => s + x.total, 0);
 const totalDebt = validSales.filter(s => s.payType==='debt').reduce((s,x) => s + x.total, 0);
 const totalRets = rets.reduce((s,x) => s + x.amount, 0);
 const netSales = totalSales - totalRets;
 const totalProfit = validSales.reduce((s,x) => s + x.items.reduce((a,i) => a + (i.price-i.cost)*i.qty, 0), 0) 
                    - rets.reduce((s,x) => s + (x.cost||0)*x.qty, 0);
 const profitMargin = totalSales > 0 ? ((totalProfit / totalSales) * 100).toFixed(1) : 0;
 return { totalSales, totalDebt, totalRets, netSales, totalProfit, profitMargin };
}

function pmCalc(src){
 const units=+(el('pm-units').value||0);
 const buy=+(el('pm-buy').value||0);
 const pr=+(el('pm-pr').value||0);
 const sell=+(el('pm-sell').value||0);
 const costPerUnit = units > 0 ? (buy / units) : 0;
 let finalSell, finalPr;
 if(src==='sell'){
  finalSell = sell;
  finalPr = Math.max(0, Math.round(sell - costPerUnit));
  el('pm-pr').value = finalPr;
 } else {
  finalPr = pr;
  finalSell = Math.round(costPerUnit + pr);
  el('pm-sell').value = finalSell;
 }
 const preview = el('pm-preview');
 if(preview){
  if(units > 0 && buy > 0){
   const totalProfit = finalPr * units;
   const profitPercent = costPerUnit > 0 ? ((finalPr / costPerUnit) * 100).toFixed(1) : 0;
   preview.innerHTML = 
    '<b style="color:#0c343b">📊 معاينة الحساب:</b><br>'+
    '• سعر التكلفة لكل قطعة: <b>'+fmt(Math.round(costPerUnit))+' ج.س</b><br>'+
    '• الربح لكل قطعة: <b style="color:#1d9e57">'+fmt(finalPr)+' ج.س</b> ('+profitPercent+'%)<br>'+
    '• سعر البيع لكل قطعة: <b style="color:#f2a516;font-size:16px">'+fmt(finalSell)+' ج.س</b><br>'+
    '• إجمالي ربح العبوة الكاملة: <b style="color:#1d9e57">'+fmt(totalProfit)+' ج.س</b>';
  } else {
   preview.innerHTML = '<span class="mut">💡 املأ عدد القطع وسعر الشراء لعرض معاينة الحساب</span>';
  }
 }
}

function doPay(id){

 const sales=DB.get('am_sales',[]),s=sales.find(x=>x.id===id);
 const prevPaid = s.paidAmount||0;
 const newPaid = prevPaid + amt;
 s.paidAmount = newPaid;
 
 if(newPaid >= s.total){
  s.debtStatus='paid';
  s.paidDate=new Date().toISOString();
  s.locked=true;
 }
 
 const pays=DB.get('am_payments',[]);
 pays.push({id:uid(),date:new Date().toISOString(),invId:s.id,inv:s.inv,amount:amt,debtor:s.debtorName,sellerId:currentUser.id,sellerName:currentUser.name});

 } else {

function pickRetInv(id){retInvId=id;retPicks={};renderCurrent()}
function retQty(pid,d,max){retPicks[pid]=Math.min(max,Math.max(0,(retPicks[pid]||0)+d));renderCurrent()}
function doReturn(){
 retReason=el('retReason')?el('retReason').value:'';
 const sales=DB.get('am_sales',[]),s=sales.find(x=>x.id===retInvId);if(!s)return;
 const prods=DB.get('am_products',[]),rets=DB.get('am_returns',[]);
 let count=0,totalAmt=0;
 Object.keys(retPicks).forEach(pid=>{
  const qty=retPicks[pid];if(!qty)return;
  const it=s.items.find(i=>i.pid===pid);if(!it)return;
  const p=prods.find(x=>x.id===pid);if(p)p.stock+=qty;
  const amt=qty*it.price;
  s.returned=s.returned||[];s.returned.push({pid,qty});
  s.total=Math.max(0,s.total-amt);s.subtotal=Math.max(0,s.subtotal-amt);
  rets.push({id:uid(),date:new Date().toISOString(),inv:s.inv,invId:s.id,pid,name:it.name,qty,amount:amt,cost:it.cost,reason:retReason||'بدون سبب',sellerId:currentUser.id,sellerName:currentUser.name});
  count++;totalAmt+=amt;});
 if(!count){toast('حدد صنفًا واحدًا على الأقل','warn');return}
 DB.set('am_sales',sales);DB.set('am_products',prods);DB.set('am_returns',rets);
 toast('تم تسجيل المرتجع ('+count+' صنف) وخصم '+fmt(totalAmt)+' ج.س من المبيعات','ok');
 retInvId=null;retPicks={};retReason='';renderCurrent();
}

  ({today:'اليوم',week:'أسبوع',month:'شهر',halfyear:'6 أشهر',year:'سنة'}[p])+'</button>'
 ).join('')+'</div>'+
 '<div class="kpis">'+
 '<div class="kpi k-p"><span class="k-lbl">إجمالي المبيعات</span><span class="num">'+fmt(stats.totalSales)+'</span><small>ج.س • '+salesList.length+' فاتورة</small></div>'+
 '<div class="kpi k-bad"><span class="k-lbl">إجمالي الديون</span><span class="num">'+fmt(stats.totalDebt)+'</span><small>ج.س</small></div>'+
 '<div class="kpi k-warn"><span class="k-lbl">إجمالي المرتجعات</span><span class="num">'+fmt(stats.totalRets)+'</span><small>ج.س • '+filteredRets.length+' عملية</small></div>'+
 '<div class="kpi k-ok"><span class="k-lbl">صافي المبيعات</span><span class="num">'+fmt(stats.netSales)+'</span><small>بعد المرتجعات</small></div>'+
 '<div class="kpi k-ok"><span class="k-lbl">صافي الربح</span><span class="num">'+fmt(stats.totalProfit)+'</span><small>ج.س</small></div>'+
 '<div class="kpi k-p"><span class="k-lbl">هامش الربح</span><span class="num">'+stats.profitMargin+'%</span><small>نسبة مئوية</small></div></div>'+
 '<div class="card" style="margin-top:12px">'+(salesList.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الفاتورة</th><th>التاريخ</th><th>الوقت</th><th>الإجمالي</th><th>النوع</th><th></th></tr></thead><tbody>'+
 salesList.map(s=>'<tr><td style="font-family:Changa;font-weight:600">'+s.inv+'</td><td>'+fmtDate(s.date)+'</td><td>'+fmtTime(s.date)+'</td><td><b>'+fmt(s.total)+' ج.س</b></td><td>'+payBadge(s)+'</td>'+
 '<td class="row-a"><button class="icobtn danger" onclick="cancelSale(\''+s.id+'\')" title="إلغاء البيع">'+ic('x',14)+'</button></td></tr>').join('')+
 '</tbody></table></div>':emptyState('chart','لا توجد مبيعات مسجلة لحسابك بعد'))+'</div>';
}
function setMySalesFilter(p){mySalesFilter=p;viewMySales()}

seed();
const session = DB.get('am_session');
if(session && session.uid){
  const u = DB.get('am_users',[]).find(x=>x.id===session.uid);
  if(u) enterApp(u);
  else renderLogin();
} else {
  renderLogin();
}
