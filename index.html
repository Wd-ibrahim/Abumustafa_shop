<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اسبيرات أبو مصطفى — نظام المبيعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#122b30; --mut:#68777b; --brand:#0e3d45; --brand2:#12525c;
  --accent:#f2a516; --accent2:#ffb52e; --ok:#1d9e57; --bad:#d2452f; --warn:#e07b12;
  --line:#dfe4e2; --bg:#eef1ef;
}
*{margin:0;padding:0;box-sizing:border-box}
html{direction:rtl}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(rgba(14,61,69,.055) 1px,transparent 1.3px) 0 0/22px 22px,linear-gradient(180deg,#f1f3f0,#e8ece9);
  min-height:100vh;-webkit-tap-highlight-color:transparent}
input,select,button{font-family:inherit}
.hidden{display:none!important}
h1,h2,h3{font-family:'Changa',sans-serif}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:.18s;user-select:none}
.btn:active{transform:scale(.96)}
.btn-p{background:linear-gradient(135deg,#175963,#0c343b);color:#fff;box-shadow:0 4px 14px rgba(12,52,59,.28)}
.btn-a{background:linear-gradient(135deg,#ffb52e,#f29b06);color:#2b1d02;box-shadow:0 4px 14px rgba(242,165,22,.38)}
.btn-g{background:#e8ecea;color:#33454a}
.btn-d{background:#fdeae6;color:#bb3a22}
.btn-wa{background:#1faa53;color:#fff;box-shadow:0 4px 14px rgba(31,170,83,.3)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:9px}
.btn-block{width:100%}
.big{padding:14px;font-size:15px}
.icobtn{width:36px;height:36px;border-radius:10px;border:0;background:#e8ecea;color:#33454a;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;position:relative;flex:0 0 auto}
.icobtn:hover{filter:brightness(.96)}
.icobtn.danger{background:#fdeae6;color:#bb3a22}
.icobtn.wa{background:#e7f7ee;color:#1faa53}
.inp{width:100%;padding:11px 12px;border:1.5px solid #d6dcdd;border-radius:11px;font-size:14px;background:#fbfcfc;transition:.15s;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(18,82,92,.13);background:#fff}
.inp.calc{background:#fffaf0;border-color:#eed9ac;font-weight:700}
.lbl{font-size:12.5px;font-weight:600;color:#41525a;margin:10px 0 5px;display:block}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.bdg.ok{background:#e3f5ea;color:#177a44}.bdg.bad{background:#fdeae6;color:#bb3a22}
.bdg.warn{background:#fdf1dc;color:#9a6a08}.bdg.info{background:#e6f0f2;color:#0e3d45}
.link{background:none;border:0;color:var(--brand2);font-size:12.5px;cursor:pointer;text-decoration:underline;margin-top:10px}
.div{height:1px;background:var(--line);margin:14px 0}
.mut{color:var(--mut)} .txt-d{color:var(--bad)} .txt-p{color:var(--brand2)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

#screen-login{min-height:100vh;display:grid;grid-template-columns:1fr}
@media(min-width:900px){#screen-login{grid-template-columns:1.15fr 1fr}}
.lg-brand{background:linear-gradient(150deg,#0a2e35,#14545f);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:32px 26px;min-height:260px}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,#f2a516 0 12px,#0a2e35 12px 24px);background-size:34px 100%;animation:haz 3s linear infinite}
@keyframes haz{to{background-position:-34px 0}}
.lg-gear{position:absolute;top:-80px;left:-80px;width:320px;height:320px;opacity:.08;animation:spin 45s linear infinite;color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.lg-chip{display:inline-flex;gap:6px;background:rgba(242,165,22,.15);border:1px solid rgba(242,165,22,.5);color:#ffc95e;font-size:12px;font-weight:600;padding:5px 13px;border-radius:99px;margin-bottom:16px}
.lg-brand h1{font-size:46px;line-height:1.1;font-weight:800}
.lg-brand h1 em{font-style:normal;color:var(--accent2)}
.lg-brand p{color:#b9cfd3;font-size:14px;margin-top:10px;max-width:420px;line-height:1.8}
.lg-feats{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.lg-feats span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:6px 12px;border-radius:9px;font-size:12px;color:#dcebee}
.lg-form{display:flex;align-items:center;justify-content:center;padding:26px}
.lg-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:400px;box-shadow:0 18px 50px rgba(12,52,59,.13)}
.lg-tabs{display:grid;grid-template-columns:1fr 1fr;background:#e8ecea;border-radius:12px;padding:4px;margin-bottom:16px}
.lg-tabs button{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:700;font-size:13.5px;color:#5c6b6f;cursor:pointer;font-family:'Changa'}
.lg-tabs button.on{background:#fff;color:var(--brand);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.lg-hint{font-size:11.5px;color:#8b989c;text-align:center;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;line-height:1.9}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

#topbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0c343b,#12525c);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:4px solid transparent;border-image:repeating-linear-gradient(-45deg,#f2a516 0 10px,#0c343b 10px 20px) 4}
#topbar .logo{width:38px;height:38px;border-radius:11px;background:rgba(242,165,22,.18);border:1px solid rgba(242,165,22,.4);color:#ffc95e;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tb-t b{font-family:'Changa';font-size:16px;display:block;line-height:1.2}
.tb-t small{font-size:10.5px;color:#9fc0c6}
.tb-x{margin-inline-start:auto;display:flex;align-items:center;gap:7px}
#topbar .icobtn{background:rgba(255,255,255,.12);color:#fff}
.uchip{background:rgba(255,255,255,.1);border-radius:10px;padding:4px 10px;text-align:center}
.uchip b{font-size:12px;display:block;line-height:1.3}
.uchip small{font-size:10px;color:#ffc95e}
.nbadge{position:absolute;top:-4px;left:-4px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:'Changa'}
#main{max-width:1100px;margin:0 auto;padding:16px 14px 160px}
#bnav{position:fixed;bottom:0;right:0;left:0;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(7px + env(safe-area-inset-bottom));z-index:40}
.nvi{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#68777b;font-weight:600;padding:5px 12px;border-radius:10px;position:relative;background:none;border:0;cursor:pointer}
.nvi.on{color:var(--brand)}
.nvi.on::after{content:'';width:16px;height:3px;border-radius:3px;background:var(--accent);position:absolute;top:-7px}
@media(min-width:1024px){#bnav{right:50%;left:auto;transform:translateX(50%);bottom:14px;border-radius:16px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(12,52,59,.16);padding:8px 12px;width:max-content}}

.page-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.page-h h2{font-size:22px;font-weight:700}
.cnt{background:#e4e9ea;color:#5c6b6f;font-size:12px;padding:2px 10px;border-radius:99px;font-weight:700;font-family:'Changa'}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(16,27,30,.05);overflow:hidden}
.card.pad{padding:16px}
.c-title{font-family:'Changa';font-size:14.5px;font-weight:700;color:var(--brand);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.live-dot{width:9px;height:9px;border-radius:50%;background:#25c06b;animation:pulse 1.8s infinite;margin-inline-start:auto}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,192,107,.5)}70%{box-shadow:0 0 0 9px rgba(37,192,107,0)}100%{box-shadow:0 0 0 0 rgba(37,192,107,0)}}
.live-txt{font-size:11px;color:#4b9a6d;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden;transition:.2s;animation:fadeup .4s both}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(12,52,59,.09)}
.kpi::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--kc,#12525c)}
.k-a{--kc:#f2a516}.k-ok{--kc:#1d9e57}.k-bad{--kc:#d2452f}.k-p{--kc:#12525c}.k-warn{--kc:#e07b12}
.k-lbl{font-size:11.5px;color:var(--mut);font-weight:600;display:block}
.kpi .num{font-family:'Changa';font-size:27px;font-weight:800;color:#0c343b;display:block;line-height:1.2}
.kpi small{font-size:10.5px;color:#8b989c}
.alert-strip{display:flex;gap:10px;align-items:center;background:#fff6e6;border:1.5px solid #f4d9a6;color:#8a5b06;padding:11px 14px;border-radius:12px;margin:12px 0;font-size:12.5px;cursor:pointer;transition:.2s}
.alert-strip:hover{background:#fff1d6}
.charts{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.bottom{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;align-items:start}
.chart{display:flex;gap:6px;align-items:flex-end;height:150px;padding-top:16px}
.cbar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.cbfill{width:100%;max-width:34px;background:linear-gradient(180deg,#1b6b76,#0e3d45);border-radius:6px 6px 2px 2px;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.3,1) both}
.cbar.today .cbfill{background:linear-gradient(180deg,#ffc247,#f2a516)}
.cbar.prev{opacity:.5}
.cbar.prev .cbfill{background:linear-gradient(180deg,#b5c8cc,#7d8b8f)}
@keyframes grow{from{transform:scaleY(0)}}
.cval{font-size:9.5px;color:#5c6b6f;font-weight:600}
.clab{font-size:11px;color:#33454a;font-weight:600}
.top-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #eef1f1}
.top-rank{width:26px;height:26px;border-radius:8px;background:#eef4f5;color:var(--brand);font-family:'Changa';font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
.top-info{flex:1;min-width:0}.top-info b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-bar{height:6px;background:#eef1f1;border-radius:9px;margin-top:5px;overflow:hidden}
.top-bar i{display:block;height:100%;background:linear-gradient(90deg,#f2a516,#ffb52e);border-radius:9px}
.top-q{font-family:'Changa';font-weight:700;color:var(--brand2)}
.feed-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed #eef1f1;gap:8px;animation:fadeup .35s both}
.feed-row small{display:block;font-size:10.5px}
.feed-x{display:flex;align-items:center;gap:8px}
.feed-x b{font-family:'Changa'}
.tr-line{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;border-bottom:1px dashed #eef1f1;align-items:center}
.tr-line.big{font-size:16px;font-family:'Changa';color:var(--brand)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
.tbl th{font-size:11px;color:#6b7a7e;text-align:right;padding:10px 8px;border-bottom:2px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid #eff2f2;vertical-align:middle}
.tbl tbody tr{transition:.12s}
.tbl tbody tr:hover td{background:#f6f9f8}
.row-a{white-space:nowrap;text-align:left}
.row-a .icobtn,.row-a .btn{margin-inline-start:4px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:#9aa7ab;padding:36px 10px;font-size:13px}

.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.pcard{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:12px;cursor:pointer;transition:.18s;user-select:none;animation:fadeup .35s both}
.pcard:active{transform:scale(.96)}
.pcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,165,22,.25);background:#fffaf0}
.pcard.out{opacity:.45;pointer-events:none}
.pc-name{font-size:13px;font-weight:600;line-height:1.4;min-height:37px;display:block}
.chk{position:absolute;top:9px;left:9px;width:21px;height:21px;border-radius:7px;background:var(--accent);color:#2b1d02;display:flex;align-items:center;justify-content:center;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.pc-price{font-family:'Changa';font-size:19px;font-weight:800;color:var(--brand);margin:4px 0 8px}
.pc-price small{font-size:11px;color:var(--mut);font-weight:600}
.pc-foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.qty{display:inline-flex;align-items:center;gap:7px;background:#eef1f1;border-radius:10px;padding:3px}
.qty button{width:27px;height:27px;border:0;border-radius:8px;background:#fff;font-size:16px;font-weight:700;color:var(--brand);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center}
.qty b{min-width:20px;text-align:center;font-family:'Changa'}
.pos-bar{position:fixed;bottom:76px;right:12px;left:12px;z-index:35;background:#10333a;color:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 32px rgba(12,52,59,.4);max-width:1076px;margin:0 auto;animation:fadeup .3s both}
.pb-info{display:flex;flex-direction:column;line-height:1.3;flex:1}
.pb-info b{font-family:'Changa';font-size:19px;color:#ffc247}
.pb-info span{font-size:11px;color:#a9c3c8}
.inv-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #e3e8e8}
.ir-n{flex:1;min-width:0}.ir-n b{font-size:13.5px;display:block}.ir-n small{color:#7d8b8f;font-size:11px}
.ir-t{font-family:'Changa';font-weight:700;min-width:66px;text-align:left;font-size:14px}
.seg{display:flex;background:#e8ecea;border-radius:11px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:700;color:#5c6b6f;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.ret-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ret-inv{border:1.5px solid var(--line);background:#fbfcfc;border-radius:11px;padding:10px;text-align:right;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:3px}
.ret-inv.on{border-color:var(--accent);background:#fffaf0;box-shadow:0 0 0 3px rgba(242,165,22,.2)}
.ret-inv small{color:#7d8b8f;font-size:11px}
.success{text-align:center;max-width:460px;margin:30px auto;padding:28px 20px!important;animation:fadeup .4s both}
.ok-ring{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#2fd07c,#14834b);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;animation:pop .55s cubic-bezier(.2,1.6,.4,1);box-shadow:0 12px 28px rgba(23,138,76,.35)}
.s-title{font-size:20px}
.s-inv{font-family:'Changa';font-size:38px;font-weight:800;color:var(--brand);line-height:1.2}
.s-meta{font-size:12.5px;color:var(--mut)}
.s-actions{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.notif-row{display:flex;flex-direction:column;padding:9px 0;border-bottom:1px dashed #eef1f1;font-size:13px}
.debt-summary{background:#f6f9f8;border-radius:11px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.debt-summary div b{display:block;font-family:'Changa';font-size:18px;margin-top:3px}
.debt-summary div small{color:var(--mut);font-size:11px}
.mov{position:fixed;inset:0;background:rgba(10,25,28,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;animation:fade .2s}
.modal{background:#fff;border-radius:16px;width:100%;max-width:460px;max-height:88vh;overflow:auto;padding:18px;animation:pop .28s cubic-bezier(.2,1.2,.4,1)}
.m-title{font-size:18px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.m-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
#toast-root{position:fixed;bottom:88px;right:0;left:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;padding:0 16px}
.toast{background:#122b30;color:#fff;padding:11px 18px;border-radius:12px;display:flex;gap:9px;align-items:center;box-shadow:0 10px 26px rgba(0,0,0,.3);animation:slideup .3s;font-size:13.5px;font-weight:600;border-inline-start:4px solid var(--accent);max-width:92vw}
.toast.ok{border-color:#25c06b}.toast.warn{border-color:#f2a516}.toast.err{border-color:#e5533a}
@keyframes fade{from{opacity:0}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes slideup{from{opacity:0;transform:translateY(16px)}}

#print-area{display:none}
@media print{
  body>*{display:none!important}
  #print-area{display:block!important;margin:0 auto;padding:2mm;font-family:'IBM Plex Sans Arabic',sans-serif;color:#000}
  @page{margin:0}
  #print-area.a4{width:210mm;min-height:297mm}
  #print-area.a4 .rc{font-size:14px;padding:10mm}
  #print-area.a4 .rc-name{font-size:22px}
  #print-area.a4 .rc-tbl{font-size:13px}
  #print-area.a4 .rc-tbl th,#print-area.a4 .rc-tbl td{padding:6px 4px}
  #print-area.receipt{width:72mm}
}
.rc{font-size:12px;text-align:center}
.rc-name{font-family:'Changa';font-weight:800;font-size:17px;margin-top:4px}
.rc-sep{border-top:1.5px dashed #000;margin:7px 0}
.rc-lr{display:flex;justify-content:space-between;margin:3px 0;text-align:right;font-size:11.5px}
.rc-tbl{width:100%;border-collapse:collapse;font-size:11px;text-align:right}
.rc-tbl th{border-bottom:1px solid #000;padding:3px 2px;text-align:right}
.rc-tbl td{padding:3px 2px;border-bottom:1px dotted #888;text-align:right}
.rc-net{font-size:14px;font-weight:800}
</style>
</head>
<body>

<div id="screen-login"></div>

<div id="screen-app" class="hidden">
  <header id="topbar"></header>
  <main id="main"></main>
  <nav id="bnav"></nav>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="print-area"></div>
<input type="file" id="importFile" class="hidden" accept=".json,application/json">

<script>
/* ================= أدوات عامة ================= */
const el=id=>document.getElementById(id);
const fmt=n=>Math.round(+n||0).toLocaleString('en');
const shortNum=n=>n>=1e6?((n/1e6).toFixed(1).replace('.0','')+'M'):n>=1e3?(Math.round(n/1e3)+'K'):String(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'''}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtDate=iso=>{const d=new Date(iso);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()};
const fmtTime=iso=>{const d=new Date(iso);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

function ensureLowNotifs(){
 const prods=DB.get('am_products',[]);let notifs=DB.get('am_notifs',[]);let changed=false;
 prods.filter(p=>p.stock<=(p.minStock||5)).forEach(p=>{
  const ex=notifs.find(n=>n.tag==='stock-'+p.id);
  if(!ex||Date.now()-ex.ts>12*3600*1000){
   notifs.unshift({id:uid(),tag:'stock-'+p.id,ts:Date.now(),date:new Date().toISOString(),text:'انخفاض المخزون: «'+p.name+'» — المتبقي '+p.stock+' قطعة'});changed=true}});
 if(changed){DB.set('am_notifs',notifs.slice(0,50))}
 updateBell();
}

 b.textContent=low;b.classList.toggle('hidden',!low);

/* ================= لوحة تحكم المدير ================= */
function viewDashboard(){
 const sales=DB.get('am_sales',[]),rets=DB.get('am_returns',[]),prods=DB.get('am_products',[]);
 const now=new Date();
 const tS=sales.filter(s=>isSameDay(new Date(s.date),now));
 const tR=rets.filter(r=>isSameDay(new Date(r.date),now));
 const netToday=tS.reduce((s,x)=>s+x.total,0)-tR.reduce((s,x)=>s+x.amount,0);
 const profToday=tS.reduce((s,x)=>s+x.items.reduce((a,i)=>a+(i.price-i.cost)*i.qty,0),0)-tR.reduce((s,x)=>s+(x.cost||0)*x.qty,0);
 const unpaid=sales.filter(s=>s.payType==='debt'&&getDebtRemaining(s)>0);
 const low=prods.filter(p=>p.stock<=(p.minStock||5));
 
 // مقارنة الأسبوع الحالي مع السابق
 const thisWeekStart=startOfWeek(now);
 const prevWeekStart=new Date(thisWeekStart);prevWeekStart.setDate(prevWeekStart.getDate()-7);
 const thisWeekSales=sales.filter(s=>{const d=new Date(s.date);return d>=thisWeekStart&&d<=now}).reduce((s,x)=>s+x.total,0);
 const prevWeekSales=sales.filter(s=>{const d=new Date(s.date);return d>=prevWeekStart&&d<thisWeekStart}).reduce((s,x)=>s+x.total,0);
 const weekDiff=thisWeekSales-prevWeekSales;
 const weekDiffPct=prevWeekSales>0?Math.round((weekDiff/prevWeekSales)*100):0;
 
 const days=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);
  const prev=new Date(d);prev.setDate(prev.getDate()-7);
  days.push({label:DAY[d.getDay()],value:sales.filter(s=>isSameDay(new Date(s.date),d)).reduce((s,x)=>s+x.total,0),
   prevValue:sales.filter(s=>isSameDay(new Date(s.date),prev)).reduce((s,x)=>s+x.total,0),mark:i===0})}
 const months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);
  months.push({label:MON[d.getMonth()],value:sales.filter(s=>{const x=new Date(s.date);return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()}).reduce((s,x)=>s+x.total,0)})}
 const agg={};sales.forEach(s=>s.items.forEach(i=>{agg[i.name]=(agg[i.name]||0)+i.qty}));
 rets.forEach(r=>{agg[r.name]=Math.max(0,(agg[r.name]||0)-r.qty)});
 const top=Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,5),maxQ=top.length?top[0][1]:1;
 const feed=sales.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
 const diffIcon=weekDiff>=0?ic('up',14):ic('down',14);
 const diffColor=weekDiff>=0?'#177a44':'#bb3a22';
 el('main').innerHTML=
 '<div class="page-h"><h2>لوحة التحكم</h2><span class="live-dot"></span><span class="live-txt">مزامنة لحظية</span></div>'+
 '<div class="kpis">'+
 '<div class="kpi k-a"><span class="k-lbl">مبيعات اليوم (صافي)</span><span class="num tw" data-v="'+netToday+'">0</span><small>ج.س • '+tS.length+' فاتورة</small></div>'+
 '<div class="kpi k-ok"><span class="k-lbl">أرباح اليوم</span><span class="num tw" data-v="'+profToday+'">0</span><small>ج.س</small></div>'+
 '<div class="kpi k-bad" onclick="go(\'debts\')" style="cursor:pointer"><span class="k-lbl">ديون متبقية</span><span class="num tw" data-v="'+unpaid.reduce((s,x)=>s+getDebtRemaining(x),0)+'">0</span><small>'+unpaid.length+' فاتورة</small></div>'+
 '<div class="kpi k-warn"><span class="k-lbl">تنبيهات مخزون</span><span class="num">'+low.length+'</span><small>'+(low.length?'منتجات تحت الحد الأدنى':'المخزون سليم ✓')+'</small></div></div>'+
 '<div class="card pad" style="margin-top:12px;background:linear-gradient(135deg,#fff8ea,#fff);border-color:#f4d9a6"><div class="c-title">'+ic('chart',16)+' مقارنة الأسبوع الحالي بالسابق</div>'+
 '<div class="tr-line"><span>هذا الأسبوع</span><b>'+fmt(thisWeekSales)+' ج.س</b></div>'+
 '<div class="tr-line"><span>الأسبوع الماضي</span><b class="mut">'+fmt(prevWeekSales)+' ج.س</b></div>'+
 '<div class="tr-line big" style="color:'+diffColor+'"><span>الفرق</span><b>'+diffIcon+' '+fmt(Math.abs(weekDiff))+' ('+(weekDiffPct>=0?'+':'')+weekDiffPct+'%)</b></div></div>'+
 (low.length?'<div class="alert-strip" onclick="openNotifs()">'+ic('alert',17)+'<span>مخزون منخفض: '+low.map(p=>esc(p.name)+' ('+p.stock+')').join('، ')+'</span></div>':'')+
 '<div class="charts"><div class="card pad"><div class="c-title">'+ic('chart',16)+' آخر 7 أيام (مقارنة)</div><div class="chart" id="chD"></div></div>'+
 '<div class="card pad"><div class="c-title">'+ic('chart',16)+' آخر 6 أشهر</div><div class="chart" id="chM"></div></div></div>'+
 '<div class="bottom"><div class="card pad"><div class="c-title">الأكثر مبيعًا</div>'+
 (top.length?top.map((t,i)=>'<div class="top-row"><span class="top-rank">'+(i+1)+'</span><div class="top-info"><b>'+esc(t[0])+'</b><div class="top-bar"><i style="width:'+Math.max(8,t[1]/maxQ*100)+'%"></i></div></div><span class="top-q">'+t[1]+'</span></div>').join(''):emptyState('box','لا مبيعات بعد'))+'</div>'+
 '<div class="card pad"><div class="c-title">آخر المبيعات اللحظية</div>'+
 (feed.length?feed.map(s=>'<div class="feed-row"><div><b style="font-family:Changa">'+s.inv+'</b><small class="mut">'+fmtTime(s.date)+' • '+esc(s.sellerName)+'</small></div><div class="feed-x">'+payBadge(s)+'<b>'+fmt(s.total)+'</b></div></div>').join(''):emptyState('cart','لا مبيعات بعد'))+'</div></div>';
 drawBars(el('chD'),days,true);drawBars(el('chM'),months);
 el('main').querySelectorAll('.tw').forEach(n=>tween(n,+n.dataset.v));
}
function drawBars(box,data,compare=false){
 const max=Math.max(...data.flatMap(d=>compare?[d.value,d.prevValue||0]:[d.value]),1);
 box.innerHTML=data.map(d=>{
  if(compare){return '<div class="cbar" style="flex-direction:row;align-items:flex-end;gap:3px"><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%"><span class="cval">'+shortNum(d.prevValue||0)+'</span><i class="cbfill prev" style="height:'+Math.max(3,(d.prevValue||0)/max*78)+'%"></i></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%"><span class="cval">'+shortNum(d.value)+'</span><i class="cbfill'+(d.mark?' today':'')+'" style="height:'+Math.max(3,d.value/max*78)+'%"></i></div><span class="clab" style="grid-column:1/-1">'+d.label+'</span></div>';}
  return '<div class="cbar'+(d.mark?' today':'')+'"><span class="cval">'+shortNum(d.value)+'</span><i class="cbfill" style="height:'+Math.max(3,d.value/max*78)+'%"></i><span class="clab">'+d.label+'</span></div>'}).join('');
}

function waDebt(id){

 const s=DB.get('am_sales',[]).find(x=>x.id===id);
 const rem=getDebtRemaining(s);
 modal('<h3 class="m-title">'+ic('wallet',19)+' تسجيل دفعة</h3>'+
 '<p class="mut" style="font-size:13px">الفاتورة '+s.inv+' — '+esc(s.debtorName)+'</p>'+
 '<div class="debt-summary"><div><small>الإجمالي</small><b>'+fmt(s.total)+'</b></div><div><small>المدفوع</small><b class="txt-p">'+fmt(s.paidAmount||0)+'</b></div><div><small>المتبقي</small><b class="txt-d">'+fmt(rem)+'</b></div></div>'+

function payFull(id){
 const s=DB.get('am_sales',[]).find(x=>x.id===id);
 const rem=getDebtRemaining(s);
 confirmBox('سداد كامل المبلغ المتبقي ('+fmt(rem)+' ج.س) للفاتورة '+s.inv+'؟ ستُقفل الفاتورة نهائيًا.',()=>doPay(id,true));
}
function doPay(id,full){
 const amt=+(el('payAmt')?el('payAmt').value:0);
 const sales=DB.get('am_sales',[]),s=sales.find(x=>x.id===id);if(!s)return;
 const rem=getDebtRemaining(s);
 let payment=full?rem:amt;
 if(payment<=0){toast('أدخل مبلغًا صحيحًا','warn');return}
 if(payment>rem){toast('المبلغ أكبر من المتبقي','warn');return}
 s.paidAmount=(s.paidAmount||0)+payment;
 if(s.paidAmount>=s.total){s.debtStatus='paid';s.paidDate=new Date().toISOString();s.locked=true;toast('تم السداد الكامل وقفل الفاتورة '+s.inv+' ✓','ok')}
 else{toast('تم تسجيل دفعة '+fmt(payment)+' — المتبقي '+fmt(s.total-s.paidAmount)+' ج.س','ok')}

function pickRetInv(id){retInvId=id;retPicks={};renderCurrent()}
function retQty(pid,d,max){retPicks[pid]=Math.min(max,Math.max(0,(retPicks[pid]||0)+d));renderCurrent()}
function doReturn(){
 retReason=el('retReason')?el('retReason').value:'';
 const sales=DB.get('am_sales',[]),s=sales.find(x=>x.id===retInvId);if(!s)return;
 if(s.locked){toast('الفاتورة مقفولة، لا يمكن المرتجع','warn');return}
 const prods=DB.get('am_products',[]),rets=DB.get('am_returns',[]);
 let count=0,totalAmt=0;
 Object.keys(retPicks).forEach(pid=>{
  const qty=retPicks[pid];if(!qty)return;
  const it=s.items.find(i=>i.pid===pid);if(!it)return;
  const p=prods.find(x=>x.id===pid);if(p)p.stock+=qty;
  const amt=qty*it.price;
  s.returned=s.returned||[];s.returned.push({pid,qty});
  s.total=Math.max(0,s.total-amt);s.subtotal=Math.max(0,s.subtotal-amt);
  if(s.payType==='debt')s.paidAmount=Math.min(s.paidAmount||0,s.total);
  rets.push({id:uid(),date:new Date().toISOString(),inv:s.inv,invId:s.id,pid,name:it.name,qty,amount:amt,cost:it.cost,reason:retReason||'بدون سبب',sellerId:currentUser.id,sellerName:currentUser.name});
  count++;totalAmt+=amt;});
 if(!count){toast('حدد صنفًا واحدًا على الأقل','warn');return}
 DB.set('am_sales',sales);DB.set('am_products',prods);DB.set('am_returns',rets);
 toast('تم تسجيل المرتجع ('+count+' صنف) وخصم '+fmt(totalAmt)+' ج.س','ok');
 retInvId=null;retPicks={};retReason='';renderCurrent();
}

function exportBackup(){
 const data={
  version:'2.0',
  exportedAt:new Date().toISOString(),
  exportedBy:currentUser?currentUser.name:'نظام',

 };
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);

 a.href=url;a.download='backup-am-'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(a);a.click();a.remove();

el('importFile').addEventListener('change',e=>{

   confirmBox('سيتم استبدال كل البيانات الحالية ببيانات الملف '+file.name+'. متأكد؟',()=>{
    DB.set('am_products',data.products||[]);

    DB.set('am_sales',data.sales||[]);
    DB.set('am_returns',data.returns||[]);
    DB.set('am_payments',data.payments||[]);
    DB.set('am_debt_payments',data.debt_payments||[]);
    DB.set('am_settings',data.settings||{});
    DB.set('am_notifs',data.notifs||[]);
    DB.set('am_logins',data.logins||[]);
    DB.set('am_day_closures',data.day_closures||[]);
    DB.set('am_seq',data.seq||0);
    DB.set('am_seeded_v2',1);
    toast('تم استيراد البيانات بنجاح ✓','ok');
    enterApp(currentUser);
   });
  }catch(err){toast('ملف غير صالح: '+err.message,'err')}
 };
 r.readAsText(file);
 e.target.value='';
});

function finalizeClose(){

 const p=DB.get('am_products',[]).find(x=>x.id===id);
 cart[id]=(cart[id]||0)+d;
 if(cart[id]<=0)delete cart[id];else if(p)cart[id]=Math.min(cart[id],p.stock);
 renderPosGrid();
}

/* ================= شاشة الفاتورة ================= */
function viewInvoice(){
 const prods=DB.get('am_products',[]);
 invItems=Object.keys(cart).map(id=>{const p=prods.find(x=>x.id===id);return p?{pid:p.id,name:p.name,price:p.sell,cost:p.buy,qty:cart[id],max:p.stock}:null}).filter(Boolean);
 if(!invItems.length){viewPOS();return}
 invPay='cash';invDiscMode='fixed';
 el('main').innerHTML='<div class="page-h"><button class="icobtn" onclick="viewPOS()">'+ic('back',18)+'</button><h2 style="font-size:19px">فاتورة جديدة</h2><span class="bdg info" style="font-family:Changa;font-size:13px">'+nextInvNo()+'</span></div>'+
 '<div class="card pad"><div id="invRows"></div><div class="div"></div>'+
 '<label class="lbl">نوع الخصم</label>'+
 '<div class="seg"><button id="segFixed" class="on" onclick="setDiscMode(\'fixed\')">مبلغ ثابت</button><button id="segPct" onclick="setDiscMode(\'pct\')">نسبة %</button></div>'+
 '<div class="g2"><div><label class="lbl">قيمة الخصم</label><input type="number" min="0" class="inp" id="invDisc" value="0" oninput="drawInvTotals()"></div>'+
 '<div><label class="lbl">المبلغ بعد الخصم</label><input type="number" class="inp calc" id="invDiscResult" readonly></div></div>'+
 '<label class="lbl" style="margin-top:14px">نوع الدفع</label>'+
 '<div class="seg"><button id="segCash" class="on" onclick="setInvPay(\'cash\')">'+ic('cash',16)+' كاش</button><button id="segDebt" onclick="setInvPay(\'debt\')">دين (آجل)</button></div>'+
 '<div id="debtBox" class="hidden"><label class="lbl">اسم المدين *</label><input class="inp" id="debtorName" placeholder="اسم العميل المدين">'+
 '<label class="lbl">رقم هاتف المدين</label><input class="inp" id="debtorPhone" inputmode="phone" dir="ltr" placeholder="09xxxxxxxx"></div>'+
 '<label class="lbl">رقم هاتف الزبون للواتساب (اختياري)</label><input class="inp" id="custPhone" inputmode="phone" dir="ltr" placeholder="09xxxxxxxx">'+
 '<div class="div"></div><div id="invTotals"></div>'+
 '<button class="btn btn-a btn-block big" style="margin-top:14px" onclick="confirmSale()">'+ic('check',18)+' تأكيد وحفظ الفاتورة</button></div>';
 drawInvRows();
}
function setDiscMode(m){invDiscMode=m;
 el('segFixed').classList.toggle('on',m==='fixed');el('segPct').classList.toggle('on',m==='pct');
 drawInvTotals();
}
function drawInvRows(){
 el('invRows').innerHTML=invItems.map((i,ix)=>'<div class="inv-row">'+
 '<div class="ir-n"><b>'+esc(i.name)+'</b><small>'+fmt(i.price)+' ج.س / قطعة</small></div>'+
 '<div class="qty"><button onclick="invQty('+ix+',-1)">−</button><b>'+i.qty+'</b><button onclick="invQty('+ix+',1)">+</button></div>'+
 '<div class="ir-t">'+fmt(i.price*i.qty)+'</div>'+
 '<button class="icobtn danger" onclick="invDel('+ix+')">'+ic('x',14)+'</button></div>').join('');
 drawInvTotals();
}
function invQty(ix,d){const i=invItems[ix];i.qty=Math.min(i.max,Math.max(1,i.qty+d));drawInvRows()}
function invDel(ix){invItems.splice(ix,1);if(!invItems.length){cart={};viewPOS();return}drawInvRows()}
function invTotalsObj(){
 const sub=invItems.reduce((s,i)=>s+i.price*i.qty,0);
 const discVal=+(el('invDisc')?el('invDisc').value:0)||0;
 let disc=invDiscMode==='pct'?Math.min(sub,Math.round(sub*discVal/100)):Math.min(discVal,sub);
 if(el('invDiscResult'))el('invDiscResult').value=disc;
 return{sub,disc,net:sub-disc};
}
function drawInvTotals(){const t=invTotalsObj();
 el('invTotals').innerHTML='<div class="tr-line"><span>الإجمالي</span><b>'+fmt(t.sub)+' ج.س</b></div>'+
 '<div class="tr-line"><span>الخصم'+(invDiscMode==='pct'?' ('+(el('invDisc').value||0)+'%)':'')+'</span><b class="txt-d">− '+fmt(t.disc)+' ج.س</b></div>'+
 '<div class="tr-line big"><span>الصافي</span><b>'+fmt(t.net)+' ج.س</b></div>'}
function setInvPay(p){invPay=p;
 el('segCash').classList.toggle('on',p==='cash');el('segDebt').classList.toggle('on',p==='debt');
 el('debtBox').classList.toggle('hidden',p!=='debt')}
function confirmSale(){
 const t=invTotalsObj();
 if(invPay==='debt'&&!el('debtorName').value.trim()){toast('اكتب اسم المدين أولًا','warn');return}
 const sales=DB.get('am_sales',[]),prods=DB.get('am_products',[]);
 const sale={id:uid(),inv:nextInvNo(),date:new Date().toISOString(),sellerId:currentUser.id,sellerName:currentUser.name,
  items:invItems.map(i=>({pid:i.pid,name:i.name,qty:i.qty,price:i.price,cost:i.cost})),
  subtotal:t.sub,discount:t.disc,total:t.net,payType:invPay,
  debtorName:invPay==='debt'?el('debtorName').value.trim():'',
  debtorPhone:(el('debtorPhone')?el('debtorPhone').value.trim():''),
  custPhone:(el('custPhone')?el('custPhone').value.trim():''),
  paidAmount:0,
  debtStatus:invPay==='debt'?'unpaid':'',paidDate:'',locked:false,returned:[]};
 invItems.forEach(i=>{const p=prods.find(x=>x.id===i.pid);if(p)p.stock=Math.max(0,p.stock-i.qty)});
 sales.push(sale);
 DB.set('am_sales',sales);DB.set('am_products',prods);DB.set('am_seq',DB.get('am_seq',0)+1);
 cart={};ensureLowNotifs();
 toast('تم حفظ الفاتورة '+sale.inv+' ✓','ok');
 showSuccess(sale);
}
function showSuccess(s){
 el('main').innerHTML='<div class="card success"><div class="ok-ring">'+ic('check',34)+'</div>'+
 '<h2 class="s-title">تم حفظ الفاتورة بنجاح</h2><div class="s-inv">'+s.inv+'</div>'+
 '<div class="s-meta">'+fmtDate(s.date)+' • '+fmtTime(s.date)+' • الصافي <b>'+fmt(s.total)+' ج.س</b></div>'+
 '<div class="s-actions"><button class="btn btn-p btn-block big" onclick="printInv(\''+s.id+'\',\'receipt\')">'+ic('print',18)+' طباعة 80mm</button>'+
 '<button class="btn btn-a btn-block big" onclick="printInv(\''+s.id+'\',\'a4\')">'+ic('print',18)+' طباعة A4</button>'+
 '<button class="btn btn-wa btn-block big" onclick="waInv(\''+s.id+'\')">'+icWA(18)+' إرسال للزبون واتساب</button>'+
 '<button class="btn btn-g btn-block" onclick="go(\'pos\')">فاتورة جديدة</button></div></div>';
}
function viewMySales(){
 const sales=DB.get('am_sales',[]).filter(s=>s.sellerId===currentUser.id).sort((a,b)=>b.date.localeCompare(a.date));
 el('main').innerHTML='<div class="page-h"><h2>مبيعاتي</h2><span class="cnt">'+sales.length+'</span></div>'+
 '<div class="card">'+(sales.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الفاتورة</th><th>التاريخ</th><th>الصنف</th><th>الإجمالي</th><th>النوع</th><th></th></tr></thead><tbody>'+
 sales.map(s=>'<tr><td style="font-family:Changa">'+s.inv+'</td><td>'+fmtDate(s.date)+'</td><td>'+s.items.reduce((a,i)=>a+i.qty,0)+' قطعة</td><td><b>'+fmt(s.total)+'</b></td><td>'+payBadge(s)+'</td>'+
 '<td class="row-a"><button class="icobtn" onclick="printInv(\''+s.id+'\',\'receipt\')">'+ic('print',15)+'</button></td></tr>').join('')+
 '</tbody></table></div>':emptyState('chart','لا مبيعات لك بعد'))+'</div>';
}

/* ================= طباعة + واتساب ================= */
function printInv(id,format='receipt'){
 const s=DB.get('am_sales',[]).find(x=>x.id===id);if(!s)return;
 const st=DB.get('am_settings',{});
 const pa=el('print-area');
 pa.className=format;
 const rem=s.payType==='debt'?getDebtRemaining(s):0;
 const paid=s.paidAmount||0;
 pa.innerHTML='<div class="rc"><div style="color:#000;display:flex;justify-content:center">'+ic('gear',format==='a4'?40:28)+'</div>'+
 '<div class="rc-name">'+esc(st.shopName||'اسبيرات أبو مصطفى')+'</div>'+
 '<div>هاتف: '+esc(st.phone||'')+'</div><div class="rc-sep"></div>'+
 '<div class="rc-lr"><span>رقم الفاتورة</span><b>'+s.inv+'</b></div>'+
 '<div class="rc-lr"><span>التاريخ</span><b>'+fmtDate(s.date)+' '+fmtTime(s.date)+'</b></div>'+
 '<div class="rc-lr"><span>البائع</span><b>'+esc(s.sellerName)+'</b></div>'+
 (s.debtorName?'<div class="rc-lr"><span>المدين</span><b>'+esc(s.debtorName)+'</b></div>':'')+
 '<div class="rc-sep"></div><table class="rc-tbl"><tr><th>الصنف</th><th>كمية</th><th>سعر</th><th>المبلغ</th></tr>'+
 s.items.map(i=>'<tr><td>'+esc(i.name)+'</td><td>'+i.qty+'</td><td>'+fmt(i.price)+'</td><td>'+fmt(i.price*i.qty)+'</td></tr>').join('')+'</table>'+
 '<div class="rc-sep"></div><div class="rc-lr"><span>الإجمالي</span><b>'+fmt(s.subtotal)+' ج.س</b></div>'+
 (s.discount?'<div class="rc-lr"><span>الخصم</span><b>−'+fmt(s.discount)+' ج.س</b></div>':'')+
 '<div class="rc-lr rc-net"><span>الصافي</span><b>'+fmt(s.total)+' ج.س</b></div>'+
 (s.payType==='debt'?'<div class="rc-lr"><span>المدفوع</span><b>'+fmt(paid)+' ج.س</b></div><div class="rc-lr"><span>المتبقي</span><b>'+fmt(rem)+' ج.س</b></div>':'')+
 '<div class="rc-lr"><span>طريقة الدفع</span><b>'+(s.payType==='cash'?'كاش':(rem<=0?'دين (مدفوع بالكامل)':'دين (آجل)'))+'</b></div>'+
 '<div class="rc-sep"></div><div style="font-weight:700">شكراً لتعاملكم معنا</div></div>';
 toast(format==='a4'?'سيتم الطباعة على ورقة A4':'اختر طابعة البلوتوث الحرارية','ok');
 setTimeout(()=>window.print(),300);
}
function waInv(id){
 const s=DB.get('am_sales',[]).find(x=>x.id===id);if(!s)return;
 const st=DB.get('am_settings',{});
 const prodsTxt=s.items.map(i=>i.name+' ('+i.qty+')').join(', ');
 const rem=getDebtRemaining(s);
 const msg='فاتورة من '+(st.shopName||'اسبيرات ابو مصطفى')+'\nرقم الفاتورة: '+s.inv+'\nالتاريخ: '+fmtDate(s.date)+'\nالمنتجات: '+prodsTxt+'\nالاجمالي: '+fmt(s.total)+' SDG'+(s.payType==='debt'?' (المتبقي: '+fmt(rem)+' SDG)':'')+'\nشكرا لتعاملكم معنا';
 let phone=(s.debtorPhone||s.custPhone||'').replace(/\D/g,'');
 if(phone.startsWith('0'))phone='249'+phone.slice(1);
 window.open((phone?'https://wa.me/'+phone+'?text='+encodeURIComponent(msg):'https://wa.me/?text='+encodeURIComponent(msg)),'_blank');
}

/* ================= التشغيل ================= */
seed();
renderLogin();
</script>
